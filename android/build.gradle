buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Task18 release stability: react-native-screens 4.x always registers CMake tasks,
// but the app deliberately runs the Paper architecture (newArchEnabled=false).
// In that mode screens does not load librnscreens.so at runtime; skipping these
// native tasks avoids a Windows/AGP prefab configuration failure while preserving
// the native build path if the New Architecture is enabled later.
subprojects { subproject ->
    // onnxruntime-react-native declares latest.integration internally. Pin the
    // native artifacts so builds are reproducible and do not need Maven's
    // dynamic-version metadata path (which is fragile on some Windows JDKs).
    subproject.configurations.configureEach {
        resolutionStrategy.force(
            "com.microsoft.onnxruntime:onnxruntime-android:1.24.3",
            "com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0"
        )
    }

    if (subproject.name == "react-native-screens") {
        subproject.afterEvaluate {
            if (rootProject.findProperty("newArchEnabled") != "true") {
                subproject.tasks.matching { task ->
                    task.name.startsWith("configureCMake") ||
                        task.name.startsWith("buildCMake") ||
                        task.name.startsWith("externalNativeBuild")
                }.configureEach { task ->
                    task.enabled = false
                }
            }
        }
    }
}
